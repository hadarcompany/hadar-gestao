services:
  waha:
    image: devlikeapro/waha:noweb
    platform: linux/amd64
    container_name: hadar-waha
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY}
      WHATSAPP_HOOK_URL: "https://gestao.agenciahadar.com.br/api/webhooks/whatsapp?token=${WAHA_WEBHOOK_TOKEN}"
      WHATSAPP_HOOK_EVENTS: "message.any,session.status,state.change"
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media

  caddy:
    image: caddy:2
    container_name: hadar-caddy
    restart: unless-stopped
    depends_on:
      - waha
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  waha-data:
  waha-media:
  caddy-data:
  caddy-config:
