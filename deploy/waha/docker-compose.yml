services:
  waha:
    image: devlikeapro/waha:noweb
    platform: linux/amd64
    container_name: hadar-waha
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY_SHA512}
      WHATSAPP_HOOK_URL: ${WHATSAPP_HOOK_URL}
      WHATSAPP_HOOK_EVENTS: "message.any,session.status,state.change"
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_DASHBOARD_ENABLED: "true"
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  waha-data:
  waha-media:
